energy_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('ENERGY_PG_HOST', '127.0.0.1') }}"
      port: "{{ env_var('ENERGY_PG_PORT', '5432') | int }}"
      dbname: "{{ env_var('ENERGY_PG_DATABASE', 'energy') }}"
      user: "{{ env_var('ENERGY_PG_USER', 'energy') }}"
      password: "{{ env_var('ENERGY_PG_PASSWORD', 'energy-local') }}"
      schema: analytics
      threads: 2
