name: Energy pipeline CI and release

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENERGY_TEST_KAFKA_BROKER: 127.0.0.1:9092
      ENERGY_TEST_PG_DATABASE: energy
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-stream.txt
            requirements-analytics.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -r requirements-stream.txt
      - run: docker compose config --quiet
      - run: docker compose up -d --wait --wait-timeout 180 kafka postgres
      - run: python -m unittest discover -s tests -v
      - name: Show service status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --timestamps kafka postgres
      - if: always()
        run: docker compose down --volumes

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Package the tested source
        run: git archive --format=tar.gz --prefix=energy-consumption/ -o energy-consumption.tar.gz HEAD
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" energy-consumption.tar.gz --verify-tag --generate-notes
