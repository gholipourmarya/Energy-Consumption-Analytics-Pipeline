x-energy-database: &energy-database
  ENERGY_PG_HOST: postgres
  ENERGY_PG_PORT: "5432"
  ENERGY_PG_DATABASE: ${ENERGY_PG_DATABASE:-energy}
  ENERGY_PG_USER: ${ENERGY_PG_USER:-energy}
  ENERGY_PG_PASSWORD: ${ENERGY_PG_PASSWORD:-energy-local}

services:
  kafka:
    image: apache/kafka:4.0.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
      interval: 5s
      timeout: 30s
      start_period: 20s
      retries: 6

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:${ENERGY_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${ENERGY_PG_DATABASE:-energy}
      POSTGRES_USER: ${ENERGY_PG_USER:-energy}
      POSTGRES_PASSWORD: ${ENERGY_PG_PASSWORD:-energy-local}
      ENERGY_GRAFANA_DB_PASSWORD: ${ENERGY_GRAFANA_DB_PASSWORD:-grafana-db-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-analytics.sh:/docker-entrypoint-initdb.d/10-analytics.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:12.4.3
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENERGY_PG_DATABASE: ${ENERGY_PG_DATABASE:-energy}
      ENERGY_GRAFANA_DB_PASSWORD: ${ENERGY_GRAFANA_DB_PASSWORD:-grafana-db-local}
      GF_SECURITY_ADMIN_PASSWORD: ${ENERGY_GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *energy-database
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__WORKERS__EXECUTION_API_TIMEOUT: "30"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          health = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=10));
          raise SystemExit(any(health[name]['status'] != 'healthy' for name in ('metadatabase', 'scheduler', 'dag_processor')))
      interval: 10s
      timeout: 12s
      start_period: 2m
      retries: 12

volumes:
  postgres-data:
  grafana-data:
  airflow-data:
  kafka-data:
